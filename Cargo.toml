[package]
name = "mouse-blur"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "Real motion blur for your mouse pointer on Windows, macOS and Linux (X11)."
license = "MIT"
repository = "https://github.com/fsiuhgshiqoih32/mouse-blur"
readme = "README.md"
keywords = ["mouse", "cursor", "motion-blur", "desktop", "overlay"]
categories = ["gui", "multimedia::images"]

[features]
default = ["tray"]
# System tray menu. On Linux this needs GTK 3 and libayatana-appindicator at build and run time;
# build with --no-default-features for a tray-less binary controlled by hotkey, CLI and config file.
tray = ["dep:tray-icon", "dep:gtk"]

[dependencies]
auto-launch = "0.6"
dirs = "7"
eframe = "0.33.3"
flate2 = "1.1.10"
global-hotkey = "0.9"
self-replace = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1"
tray-icon = { version = "0.26", optional = true }
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
x11rb = { version = "0.13", features = ["shape", "xfixes", "randr"] }

[build-dependencies]
# Only used when the target is Windows; see build.rs.
winresource = "0.1"

[dev-dependencies]
png = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
